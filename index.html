    <!-- Brand fonts: Lora (serif), Source Sans 3 (sans), Source Code Pro (mono).
         Mirror of haven-ui/apps/patient/index.html. Without these, system fallback
         fonts render OpenType feature codes as superscript/small-cap glyphs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet" />

    <!-- Material Symbols (outlined). Internal-doc placeholder until FA Pro
         access is provisioned. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <!-- SPA redirect resolver: 404.html encodes the requested path into ?p=…;
         this runs before React mounts and restores the route via History API
         so React Router sees the correct location on first paint. -->
    <script>
      (function () {
        var l = window.location;
        if (!/[?&]p=/.test(l.search)) return;
        var query = l.search.slice(1).split('&').reduce(function (acc, kv) {
          var i = kv.indexOf('=');
          acc[kv.slice(0, i)] = kv.slice(i + 1);
          return acc;
        }, {});
        var path = (query.p || '').replace(/~and~/g, '&');
        var rest = query.q ? '?' + query.q.replace(/~and~/g, '&') : '';
        window.history.replaceState(
          null,
          '',
          l.pathname.replace(/\/$/, '') + path + rest + l.hash
        );
      })();
    </script>
